name: X自動投稿（毎朝8時）

on:
  schedule:
    - cron: '0 23 * * *' # 23:00 UTC = 翌朝 8:00 JST（数分〜数十分遅れることがあります）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せずに本文の確認だけする'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 今日の投稿
        run: node social/x-autopost.js ${{ inputs.dry_run == true && '--dry-run' || '' }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
